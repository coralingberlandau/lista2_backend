<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6A5BD6"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE9FF"/><stop offset="1" stop-color="#FFE6EC"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" rx="18" fill="#FBFAF7" stroke="#D9D4EA"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#2B2547">Lista 2 architecture</text>

  <!-- User -->
  <rect x="30" y="215" width="140" height="90" rx="14" fill="#fff" stroke="#6A5BD6" stroke-width="1.5"/>
  <text x="100" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">User</text>
  <text x="100" y="274" text-anchor="middle" font-size="12" fill="#5B5675">phone or desktop</text>
  <text x="100" y="291" text-anchor="middle" font-size="12" fill="#5B5675">browser</text>

  <!-- Netlify group -->
  <rect x="215" y="70" width="270" height="400" rx="16" fill="url(#g)" stroke="#C9C2E6"/>
  <text x="350" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A5BD6">NETLIFY</text>
  <rect x="240" y="120" width="220" height="110" rx="12" fill="#fff" stroke="#6A5BD6"/>
  <text x="350" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">Lista frontend</text>
  <text x="350" y="174" text-anchor="middle" font-size="12" fill="#5B5675">React Native + Expo (web build)</text>
  <text x="350" y="192" text-anchor="middle" font-size="12" fill="#5B5675">TypeScript, Axios, session renewal</text>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#5B5675">static site</text>
  <rect x="240" y="330" width="220" height="100" rx="12" fill="#fff" stroke="#6A5BD6"/>
  <text x="350" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">Serverless function</text>
  <text x="350" y="384" text-anchor="middle" font-size="12" fill="#5B5675">recommendations.js</text>
  <text x="350" y="402" text-anchor="middle" font-size="12" fill="#5B5675">holds the Gemini key</text>

  <!-- PythonAnywhere group -->
  <rect x="540" y="70" width="330" height="270" rx="16" fill="url(#g)" stroke="#C9C2E6"/>
  <text x="705" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A5BD6">PYTHONANYWHERE</text>
  <rect x="565" y="120" width="280" height="110" rx="12" fill="#fff" stroke="#6A5BD6"/>
  <text x="705" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">Lista backend</text>
  <text x="705" y="174" text-anchor="middle" font-size="12" fill="#5B5675">Django 5.2 + Django REST Framework</text>
  <text x="705" y="192" text-anchor="middle" font-size="12" fill="#5B5675">JWT login + refresh, per-list permissions</text>
  <text x="705" y="210" text-anchor="middle" font-size="12" fill="#5B5675">password rules, redacted logs</text>
  <rect x="565" y="255" width="280" height="62" rx="12" fill="#fff" stroke="#6A5BD6"/>
  <text x="705" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">SQLite + image files</text>
  <text x="705" y="302" text-anchor="middle" font-size="12" fill="#5B5675">on a persistent disk</text>

  <!-- External services -->
  <rect x="750" y="385" width="120" height="70" rx="12" fill="#fff" stroke="#E0708A"/>
  <text x="810" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">Brevo</text>
  <text x="810" y="435" text-anchor="middle" font-size="12" fill="#5B5675">reset emails</text>
  <rect x="540" y="385" width="140" height="70" rx="12" fill="#fff" stroke="#E0708A"/>
  <text x="610" y="415" text-anchor="middle" font-size="15" font-weight="bold" fill="#2B2547">Google Gemini</text>
  <text x="610" y="435" text-anchor="middle" font-size="12" fill="#5B5675">list ideas</text>

  <!-- Arrows -->
  <line x1="170" y1="260" x2="238" y2="190" stroke="#6A5BD6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="170" x2="563" y2="170" stroke="#6A5BD6" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="511" y="160" text-anchor="middle" font-size="11" fill="#5B5675">HTTPS</text>
  <text x="511" y="188" text-anchor="middle" font-size="11" fill="#5B5675">REST + JWT</text>
  <line x1="350" y1="230" x2="350" y2="328" stroke="#6A5BD6" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="285" font-size="11" fill="#5B5675">AI request</text>
  <line x1="460" y1="410" x2="538" y2="418" stroke="#6A5BD6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="705" y1="230" x2="705" y2="253" stroke="#6A5BD6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M810 340 L810 383" stroke="#6A5BD6" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="822" y="366" font-size="11" fill="#5B5675">send email</text>
  <path d="M810 455 L810 505 L100 505 L100 307" stroke="#E0708A" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="385" y="498" text-anchor="middle" font-size="11" fill="#5B5675">email with a single-use reset link back to the user, who opens it on the Lista site</text>
</svg>
